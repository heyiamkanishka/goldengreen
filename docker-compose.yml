services:
  goldengreen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goldengreen-web
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
